[project]
name = "analysis-tools"
version = "0.1.0"
description = "Visualization and data analysis tools for the thesis"
requires-python = ">=3.13"
dependencies = [
    # Reference the parent project so you can import benchmark code/types
    "thesis-function-calling", 
    # Analysis specific libs
    "marimo>=0.19.7",
    "matplotlib>=3.10.8",
    "nicegui>=2.0.0",
    "polars>=1.38.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
