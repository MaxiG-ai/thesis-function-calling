[project]
name = "thesis-function-calling"
version = "0.1.0"
description = "Repository to run the benchmark execution for memory tests on ComplexFuncBench"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flagembedding>=1.3.5",
    "jsonlines>=4.0.0",
    "litellm>=1.80.0",
    "marimo>=0.19.7",
    "matplotlib>=3.10.8",
    "memorch>=0.2",
    "numpy>=2.3.5",
    "polars>=1.38.0",
    "pydantic>=2.12.4",
    "pytest>=7.4.0",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "tiktoken>=0.5.0",
    "torch>=2.9.1",
    "transformers", # ==4.57.1",
    "urllib3>=2.5.0",
    "wandb",
    "weave",
    "nicegui>=2.0.0",
    "ruff>=0.15.2",
    "pandas>=2.3.3",
]

[tool.uv.sources]
memorch = { git = "https://github.com/MaxiG-ai/memory-orchestrator.git", branch = "haystack-experiment" }
